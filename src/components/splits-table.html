<div class="splits">
  <h2 class="panel__title">Splits</h2>
  <p class="panel__subtitle">Every ${unitLabel}, with the boundary interpolated along the
    straddling segment</p>

  <div class="splits__scroll">
    <table class="splits__table">
      <thead>
        <tr>
          <th scope="col">${unitLabel}</th>
          <th scope="col">Time</th>
          <th scope="col">Speed</th>
          <th scope="col">Elev +</th>
          <th scope="col" if.bind="stats.hasHeartRate">Avg HR</th>
          <th scope="col" class="splits__bar-head"><span class="visually-hidden">Relative speed</span></th>
        </tr>
      </thead>
      <tbody>
        <tr repeat.for="row of rows" class="${row.partial ? 'is-partial' : ''}">
          <th scope="row">${row.label}</th>
          <td>${row.duration}</td>
          <td>${row.speed}</td>
          <td>${row.elevGain}</td>
          <td if.bind="stats.hasHeartRate">${row.avgHr}</td>
          <td class="splits__bar-cell">
            <span class="splits__bar" aria-hidden="true" style="width: ${row.barPercent}%"></span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
